<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steel Surface Defect Detection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101418;
      color: #f5f5f5;
    }

    header {
      padding: 24px 8%;
      border-bottom: 1px solid #30363d;
    }

    header h2 {
      margin: 0;
      color: #8bc4ff;
    }

    main {
      max-width: 1000px;
      margin: 55px auto;
      padding: 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .intro p {
      color: #aeb8c4;
      line-height: 1.6;
    }

    .panel {
      background: #1a2027;
      border: 1px solid #303944;
      border-radius: 14px;
      padding: 28px;
    }

    label {
      display: block;
      margin: 18px 0 10px;
      font-weight: bold;
    }

    input[type="file"] {
      width: 100%;
      padding: 15px;
      border: 1px dashed #63758a;
      border-radius: 8px;
      background: #121820;
      color: white;
    }

    input[type="range"] {
      width: 100%;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 14px;
      background: #3984e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }

    .image-box {
      padding: 15px;
      background: #121820;
      border-radius: 10px;
      min-width: 0;
    }

    .image-box h3 {
      margin-top: 0;
    }

    img {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    #status, #results {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
      margin-top: 20px;
    }

    #status {
      color: #8bc4ff;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #8c98a6;
    }
  </style>
</head>

<body>

<header>
  <h2>SteelDefect AI</h2>
</header>

<main>
  <section class="intro">
    <h1>Steel Surface Defect Detection</h1>
    <p>
      AI-powered steel surface inspection using
      YOLO26m with the proposed MSC module.
    </p>
  </section>

  <section class="panel">
    <label for="imageInput">Upload a steel surface image</label>
    <input
      type="file"
      id="imageInput"
      accept="image/png,image/jpeg,image/webp"
    >

    <label for="confidence">
      Confidence Threshold:
      <span id="confidenceValue">0.25</span>
    </label>

    <input
      type="range"
      id="confidence"
      min="0.10"
      max="0.90"
      value="0.25"
      step="0.05"
    >

    <button id="detectButton">Detect Defects</button>

    <div id="status" role="status"></div>

    <div class="preview">
      <div class="image-box">
        <h3>Input Image</h3>
        <img id="inputPreview" alt="Uploaded steel image" hidden>
      </div>

      <div class="image-box">
        <h3>Detection Result</h3>
        <img id="outputPreview" alt="Steel defect detection result" hidden>
      </div>
    </div>

    <div id="results"></div>
  </section>
</main>

<footer>
  YOLO26m + MSC | Steel Surface Defect Detection
</footer>

<script>
  const imageInput = document.getElementById("imageInput");
  const confidence = document.getElementById("confidence");
  const confidenceValue = document.getElementById("confidenceValue");
  const detectButton = document.getElementById("detectButton");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const inputPreview = document.getElementById("inputPreview");
  const outputPreview = document.getElementById("outputPreview");

  confidence.addEventListener("input", () => {
    confidenceValue.textContent = Number(confidence.value).toFixed(2);
  });

  imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      status.textContent = "Please select a valid image.";
      imageInput.value = "";
      return;
    }

    inputPreview.src = URL.createObjectURL(file);
    inputPreview.hidden = false;

    outputPreview.hidden = true;
    results.textContent = "";
    status.textContent = "";
  });

  detectButton.addEventListener("click", async () => {
    const file = imageInput.files[0];

    if (!file) {
      status.textContent = "Please upload an image first.";
      return;
    }

    detectButton.disabled = true;
    status.textContent = "Processing image...";
    results.textContent = "";

    try {
      const formData = new FormData();

      formData.append("image", file);
      formData.append("confidence", confidence.value);

      const response = await fetch("/api/detect", {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Detection request failed.");
      }

      if (!data.image) {
        throw new Error("The inference service returned no result image.");
      }

      outputPreview.src = data.image;
      outputPreview.hidden = false;

      results.textContent = data.detections || "Detection completed.";
      status.textContent = "Detection completed successfully.";

    } catch (error) {
      status.textContent = error.message;
    } finally {
      detectButton.disabled = false;
    }
  });
</script>

</body>
</html>
